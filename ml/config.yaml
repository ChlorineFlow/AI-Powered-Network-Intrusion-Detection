# ML pipeline configuration
# Populated as each phase is implemented — placeholders only for now.

random_seed: 42

datasets:
  cicids2017:
    raw_dir: data/raw/cicids2017
    enabled: true
  nsl_kdd:
    raw_dir: data/raw/nsl_kdd
    enabled: true
  unsw_nb15:
    raw_dir: data/raw/unsw_nb15
    enabled: true

split:
  test_size: 0.2
  val_size: 0.1
  stratify: true

preprocessing:
  scaling: standard   # options: standard, minmax
  categorical_encoding: onehot

class_imbalance:
  strategy: null       # options: class_weight, undersample, smote (train split only)

multiclass:
  min_class_samples: 50   # classes with fewer total samples are excluded
                           # from multiclass evaluation (statistically
                           # unreliable at this sample size); they remain
                           # included in binary classification.
  excluded_classes_reason: >
    Classes with fewer than min_class_samples total occurrences are
    excluded from multiclass train/val/test evaluation because a
    stratified split would leave 1-4 samples per split, making any
    precision/recall/F1 reported for them statistically meaningless
    (a single sample can swing the metric by 25-100%). These attacks
    remain part of the binary BENIGN/ATTACK classification task.

models:
  baseline:
    - logistic_regression
    - decision_tree
  advanced:
    - random_forest
    - xgboost
    - svm

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - confusion_matrix
    - false_positive_rate
    - false_negative_rate
  averaging:
    - macro
    - weighted

explainability:
  methods:
    - shap
    - permutation_importance

paths:
  processed_dir: data/processed
  saved_models_dir: saved_models
  experiments_dir: experiments
  figures_dir: figures
